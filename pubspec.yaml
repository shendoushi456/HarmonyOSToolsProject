name: harmonyos_flutter_empty
description: "悠游出行 - 鸿蒙 Flutter 迁移工程"
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: 2.3.7
  riverpod_annotation: 2.1.2

  # 路由
  go_router: 7.1.1

  # 国际化
  intl: ^0.19.0  # CODEBUDDY.md 原定 0.17.0，但 flutter_localizations (3.27.4) 强制要求 0.19.0

  # 字体渲染
  flutter_svg: 2.0.5

  # 以下依赖当前迁移暂未用到，需要时再启用（ohos 平台需确认 fork 来源）：
  # fl_chart: 0.55.2
  # table_calendar: 3.0.8
  # path_provider: 2.1.0
  # shared_preferences: 2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: 4.0.0
  alchemist: 0.6.1
  riverpod_generator: 2.2.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/che/
    - assets/images/car/
    - assets/images/setting/

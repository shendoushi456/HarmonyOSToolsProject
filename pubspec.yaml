name: qingman_weather
description: 易扫拍客 - Flutter-ohos 版
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.19.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理（CODEBUDDY.md 规定）
  flutter_riverpod: 2.3.7
  riverpod_annotation: 2.1.2

  # 路由
  go_router: 7.1.1

  # 图表（趋势折线图备选；主用 CustomPaint）
  fl_chart: 0.55.2

  # 国际化（flutter_localizations 锁定 intl 0.19.0，从 0.17.0 放宽）
  intl: 0.19.0

  # 字体渲染/SVG
  flutter_svg: 2.0.5

  # 网络（纯 Dart，无需 ohos 适配）
  dio: 5.4.0

  # 识别功能：沿用 master_quannengbaojuku“添加识别功能”提交的鸿蒙适配版本。
  camera:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_packages.git
      path: packages/camera/camera
      ref: camera-v0.11.1-ohos-1.0.1
  image_picker:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_packages.git
      path: packages/image_picker/image_picker
      ref: image_picker-v1.1.2-ohos-1.0.1

  # 打开协议 URL（系统浏览器）
  url_launcher: 6.1.11

  # 应用内 WebView 显示协议页(OpenHarmony 适配版)
  webview_flutter_ohos:
    git:
      url: https://gitcode.com/Chyuning/webview_flutter_ohos.git
      ref: main

  # 存储（需 ohos 适配，从 gitcode.com/openharmony-tpc/flutter_packages 获取）
  # 主包内部已声明对 *_ohos 适配包的依赖，无需显式引入 _ohos 包
  shared_preferences:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/shared_preferences/shared_preferences
      ref: br_shared_preferences-v2.5.3_ohos
  path_provider:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: br_path_provider-v2.1.5_ohos

  # ====== LifeTools 新增依赖（2026-08-21）======
  # SQLite（记事本/记账共享 Notepad.db）- 鸿蒙适配
#  sqflite: ^2.3.3+1
  sqflite:
    git:
      url: "https://gitcode.com/CPF-Flutter/flutter_sqflite.git"
      # ref: 请根据下方TAG版本对应表选择TAG
      ref: 2.2.8-ohos-1.0.0
      path: sqflite
#  sqflite_common_ffi: ^2.3.3  # 备选：FFI 模式，鸿蒙无原生 host 实现时降级

  # 图片处理（毛玻璃 box-blur + 画板保存 PNG）- 纯 Dart 无需 ohos 适配
  image: ^4.1.7

  # 传感器（指南针）- 鸿蒙适配
  sensors_plus:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_plus_plugins.git
      path: packages/sensors_plus/sensors_plus
      ref: br_sensors_plus-v6.1.1_ohos

  # ====== MenuHome PDF + 二维码新增依赖（2026-08-22）======
  # PDF 备用纯 Dart 方案（当 pdfService 不可用时降级）
  pdf: ^3.11.1

  # 生成二维码
  qr_flutter: ^4.1.0

  # 二维码扫描：采用 master_saolaisao 已接入的鸿蒙原生扫码预览实现。
  qr_code_scanner_ohos: 1.0.0

  # 选择 PDF 文件 - 鸿蒙适配版
  file_picker_ohos:
    git:
      url: https://gitcode.com/openharmony-sig/fluttertpc_file_picker.git
      ref: br_v10.3.8_ohos

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  riverpod_generator: 2.2.0
  build_runner: ^2.3.3
  very_good_analysis: 4.0.0

# 覆盖 file_picker_ohos 对 hosted image_picker 的依赖，强制使用鸿蒙适配版
dependency_overrides:
  image_picker:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_packages.git
      path: packages/image_picker/image_picker
      ref: image_picker-v1.1.2-ohos-1.0.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/images/menu_fragment/
    - assets/images/menu_fragment_toolbox_c/
    - assets/images/image_gallery_toolbox_c/
    - assets/images/scan_tools_toolbox_c/
    - assets/images/bottom_nav_toolbox_c/
    - assets/images/other_scan_tools/
    - assets/images/favorite/
    - assets/images/bottom_navigation/
    - assets/hot_city.json
    - assets/game/xiaoqiaomen.html   # 生活小窍门 WebView 本地资源
    # HarmonyOS Flutter 构建不会递归收录此目录；WebToolPage 会逐项从
    # rootBundle 复制到临时目录，故将 HTML 的全部相对依赖显式声明。
    - assets/game/jintianchishenme/index.html
    - assets/game/jintianchishenme/style/css/eat-min.css
    - assets/game/jintianchishenme/style/css/img/bg.jpg
    - assets/game/jintianchishenme/style/img/logo.png
    - assets/game/jintianchishenme/style/js/jquery-1.11.1.min.js
    - assets/game/ershisijieqi/       # 二十四节气 WebView 本地资源
    - assets/game/ershisijieqi/css/       # 二十四节气 WebView 本地资源
    - assets/game/ershisijieqi/js/       # 二十四节气 WebView 本地资源
    - assets/game/ershisijieqi/images/       # 二十四节气 WebView 本地资源

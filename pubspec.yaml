name: qingman_weather
description: 瞬变天讯 - Flutter-ohos 版
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.19.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理（CODEBUDDY.md 规定）
  flutter_riverpod: 2.3.7
  riverpod_annotation: 2.1.2

  # 路由
  go_router: 7.1.1

  # 图表（趋势折线图备选；主用 CustomPaint）
  fl_chart: 0.55.2

  # 国际化（flutter_localizations 锁定 intl 0.19.0，从 0.17.0 放宽）
  intl: 0.19.0

  # 字体渲染/SVG
  flutter_svg: 2.0.5

  # 网络（纯 Dart，无需 ohos 适配）
  dio: 5.4.0

  # 瀑布流网格（历史上的今天 2 列瀑布流，对齐 Android StaggeredGridLayoutManager）
  flutter_staggered_grid_view: ^0.7.0

  # 打开协议 URL（系统浏览器）
  url_launcher: 6.1.11

  # 应用内 WebView 显示协议页(OpenHarmony 适配版)
  webview_flutter_ohos:
    git:
      url: https://gitcode.com/Chyuning/webview_flutter_ohos.git
      ref: main

  # 存储（需 ohos 适配，从 gitcode.com/openharmony-tpc/flutter_packages 获取）
  # 主包内部已声明对 *_ohos 适配包的依赖，无需显式引入 _ohos 包
  shared_preferences:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/shared_preferences/shared_preferences
      ref: br_shared_preferences-v2.5.3_ohos
  path_provider:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: br_path_provider-v2.1.5_ohos

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  riverpod_generator: 2.2.0
  build_runner: ^2.3.3
  very_good_analysis: 4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    # Flutter 的目录声明不会递归收录子目录；显式登记迁入的 toolbox 天气资源。
    - assets/images/toolbox_weather/
    # LifeFragment 迁入资源使用独立命名空间，避免马甲 UI 资源同名冲突。
    - assets/images/toolbox_life/
    # NongyeFragment 与长途规划使用 Android 原图，分别隔离命名空间。
    - assets/images/toolbox_agriculture/
    - assets/images/toolbox_long_trip/
    # AirQualityFragment 的 Android 原始背景、天气和污染物图标。
    - assets/images/toolbox_air_quality/
    - assets/hot_city.json
    # 二十四节气 H5 资源目录（对齐 Android assets/ershisijieqi/）
    - assets/ershisijieqi/
    - assets/ershisijieqi/css/
    - assets/ershisijieqi/images/
    - assets/ershisijieqi/js/
    # 生活小窍门 H5（对齐 Android assets/xiaoqiaomen.html）
    - assets/xiaoqiaomen.html
